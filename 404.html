<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#10263d">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>Página não encontrada | LaTranslados</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/option3.css">
  <style>
    .not-found { display: grid; min-height: 100svh; place-items: center; padding: 40px 0; background: var(--navy-deep); color: white; text-align: center; }
    .not-found h1 { margin-bottom: 14px; color: white; font-size: clamp(2rem, 6vw, 3.2rem); }
    .not-found p { max-width: 460px; margin: 0 auto 28px; color: rgb(255 255 255 / 78%); }
    .not-found .eyebrow { color: var(--lime); }
  </style>
</head>
<body>
  <main class="not-found">
    <div class="container">
      <p class="eyebrow">Erro 404</p>
      <h1>Esta página não existe.</h1>
      <p>O endereço pode ter mudado. Volte para a página inicial ou fale com a gente pelo WhatsApp.</p>
      <div class="hero-actions" style="justify-content: center;">
        <a class="button" href="/">Ir para a página inicial</a>
        <a class="button button-quiet" href="https://wa.me/5551998815818" target="_blank" rel="noopener noreferrer">Falar pelo WhatsApp</a>
      </div>
    </div>
  </main>
</body>
</html>
